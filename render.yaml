services:
  - type: web
    name: woodcraft-store
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        value: file:/data/prod.db
    disk:
      name: woodcraft-data
      mountPath: /data
      sizeGB: 1
